[project]
name = "tuba-terim-mcp"
version = "0.1.0"
description = "MCP server for the TÜBA Türkçe Bilim Terimleri Sözlüğü."
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
tuba-terim-mcp = "tuba_terim_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tuba_terim_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
